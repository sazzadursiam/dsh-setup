# dsh-team-updater — one settings row that updates this dsh install from the GUI.
#
# The row is inserted into the profile's tree. The Loader resolves `name` as a
# module specifier (from the dsh installation first, then the profile's own
# node_modules, where `dsh plugin --profile web add <spec>` installs it).
#
# A patch replaces the targeted row's whole `config`, so every key this plugin
# owns is restated here.

- insert:
    - id: team-updater
      name: dsh-team-updater
      config:
        # The row installs the version dsh-setup's DSH_VERSION names, found in the
        # checkout this plugin was added from — the same version setup and update
        # install, so the two never pull a machine in opposite directions. Only
        # when no DSH_VERSION can be found does it fall back to `tag` below.
        # To point at a pin file elsewhere, set versionFile to its path:
        # versionFile: /path/to/DSH_VERSION
        #
        # npm dist-tag to follow when unpinned: 'latest' | 'next' | 'alpha', or an
        # exact version.
        tag: latest
        # Registry to query and install from.
        registry: https://registry.npmjs.org
        # Relaunch dsh with the same arguments after the update is installed.
        restart: true
        # Versions the button must never offer, and why. The reason is shown in
        # the row. Drop an entry once a version that fixes it is out.
        blocked:
          0.1.5-rc.1: >-
            cannot resume sessions written by an earlier dsh; every resume fails
            with 'cannot get property "agent" without inject'
          0.1.5-rc.2: >-
            same 0.1.5 line as rc.1, which cannot resume older sessions; not
            tested here, so it is held back rather than assumed fixed
