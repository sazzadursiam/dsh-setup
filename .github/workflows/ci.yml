name: CI

on:
  push:
    branches: [master]
  pull_request:

# A push to master while an older run for the same branch is still going gets
# the older one cancelled - only the latest commit's result matters here.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck + line endings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck

      - name: .bat/.cmd files must be checked out as CRLF
        # cmd.exe's batch parser assumes CRLF - an LF-only .bat can misparse
        # labels, goto targets and multi-line if () blocks (see .gitattributes).
        # `git ls-files --eol` reports how each tracked file is actually
        # materialized in the working tree, which is what cmd.exe would read.
        run: |
          bad=$(git ls-files --eol -- '*.bat' '*.cmd' | grep -v 'w/crlf' || true)
          if [ -n "$bad" ]; then
            printf 'Not checked out as CRLF:\n%s\n' "$bad"
            exit 1
          fi

      - name: batch-file jumps must resolve
        # cmd.exe has no `bash -n`. A goto or call to a label that was renamed or
        # deleted only fails when that path runs - on a fresh machine, for setup.bat.
        run: node tests/bat-labels.mjs

      - name: Markdown links and anchors must resolve
        # Runs on Linux on purpose: GitHub serves the docs case-sensitively, and a
        # link that only works on a case-insensitive Windows or macOS checkout is
        # still broken for readers. External links are not fetched.
        run: node tests/md-links.mjs

  version:
    name: VERSION matches CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: VERSION must equal the newest release heading in CHANGELOG.md
        # v0.5.0 was released with VERSION still at 0.4.0, so verify and update
        # reported the wrong version. `## [Unreleased]` has no digits and is
        # skipped, so this only trips when a release heading and VERSION diverge.
        run: |
          file=$(tr -d '[:space:]' < VERSION)
          latest=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed -E 's/^## \[([^]]*)\].*/\1/')
          if [ -z "$latest" ]; then
            echo "No released version heading found in CHANGELOG.md"
            exit 1
          fi
          if [ "$file" != "$latest" ]; then
            echo "VERSION is $file but the newest release in CHANGELOG.md is $latest"
            exit 1
          fi
          echo "VERSION $file matches CHANGELOG.md"

  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: agents.sh / verify.sh
        run: ./tests/smoke.sh

      - name: plugins/team-updater unit tests
        run: node plugins/team-updater/tests/check.mjs

      - name: plugins/figma-bridge unit tests
        run: node plugins/figma-bridge/tests/check.mjs

  smoke-windows:
    name: Smoke test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: agents.bat / verify.bat
        shell: cmd
        run: tests\smoke.bat

      - name: plugins/team-updater unit tests
        run: node plugins/team-updater/tests/check.mjs

      - name: plugins/figma-bridge unit tests
        run: node plugins/figma-bridge/tests/check.mjs
